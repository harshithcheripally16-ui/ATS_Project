<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/utils/theme-init.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Recruitment ATS</title>
  <link rel="stylesheet" href="/css/material-theme.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="card" style="max-width: 440px; width: 100%;">
      <div style="text-align: center; margin-bottom: 24px;">
        <h2>Forgot Password</h2>
        <p class="text-muted" style="margin-top: 6px;">Enter your registered email and we'll send you a password reset link.</p>
      </div>

      <div id="alert-box" style="display: none; padding: 12px; border-radius: var(--md-sys-radius-sm); margin-bottom: 16px; font-size: 0.9rem;"></div>

      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Send Reset Link</button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
        <a href="/pages/login.html" style="color: var(--md-sys-color-primary); text-decoration: none;">&larr; Back to Sign In</a>
      </div>
    </div>
  </main>

  <script src="/js/api/client.js"></script>
  <script src="/js/api/auth.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      const alertBox = document.getElementById('alert-box');
      const email = document.getElementById('email').value.trim();

      submitBtn.disabled = true;
      submitBtn.innerText = 'Sending...';

      try {
        const res = await window.authApi.forgotPassword(email);
        alertBox.style.display = 'block';
        alertBox.style.background = 'rgba(16, 185, 129, 0.15)';
        alertBox.style.color = '#34d399';
        alertBox.style.border = '1px solid rgba(16, 185, 129, 0.3)';
        alertBox.innerHTML = `
          <strong>Password Reset Request Sent!</strong>
          <p style="margin: 8px 0 12px 0; font-size: 0.88rem; color: #a7f3d0;">${res.message}</p>
          <a href="/pages/reset-password.html?email=${encodeURIComponent(email)}" class="btn btn-primary btn-sm" style="display: inline-flex; align-items: center; gap: 6px; text-decoration: none;">
            <span class="material-icons icon-sm">lock_reset</span> Enter Reset Code &rarr;
          </a>
        `;
        submitBtn.disabled = false;
        submitBtn.innerText = 'Resend Reset Code';
      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
        alertBox.style.color = '#f87171';
        alertBox.style.border = '1px solid rgba(239, 68, 68, 0.3)';
        alertBox.innerText = err.message;
        submitBtn.disabled = false;
        submitBtn.innerText = 'Send Reset Code';
      }
    });
  </script>
</body>
</html>

services:
  - type: web
    name: ats-recruitment-portal
    runtime: python
    buildCommand: pip install -r requirements.txt && (which npm > /dev/null 2>&1 && npm --prefix frontend install && npm --prefix frontend run build || echo "Using prebuilt frontend dist")
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRES_HOURS
        value: "24"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "True"
      - key: EXPOSE_DEV_OTP
        value: "True"
      - key: RESEND_API_KEY
        sync: false
